# Pre-commit hooks configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: go-build
        name: Build Go binary
        entry: task build
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: Run Go tests
        entry: task test
        language: system
        pass_filenames: false
        types: [go]

      - id: go-lint
        name: Run Go linters
        entry: task lint
        language: system
        pass_filenames: false
        types: [go]

      - id: go-mod-tidy
        name: Run go mod tidy
        entry: task tidy
        language: system
        pass_filenames: false
        files: go\.(mod|sum)$
